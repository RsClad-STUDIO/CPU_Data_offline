[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpu-data-offline"
version = "0.1.0"
description = "Offline CPU information database and search tool"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "urllib3>=1.26.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.0.0",
]

[project.scripts]
cpu-lookup = "cpu_data.cli:main"
cpu-data-update = "cpu_data.application.update:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["cpu_data*"]
